var ordningAudio = null;

function afspilOrdningsLyd() {
  stopOrdningsLyd();
  try {
    ordningAudio = new Audio(ORDNING_LYD);
    ordningAudio.volume = 1;
    var p = ordningAudio.play();
    // Kan browseren ikke afspille filen, falder vi tilbage til hornet
    if (p && p.catch) p.catch(function () { hoejLyd(); });
  } catch (e) { hoejLyd(); }
}

function stopOrdningsLyd() {
  if (!ordningAudio) return;
  try { ordningAudio.pause(); ordningAudio.currentTime = 0; } catch (e) {}
  ordningAudio = null;
}

function alarmLyd() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ac = new Ctx();
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    var nu = ac.currentTime + 0.02;

    function tone(start, laengde, grund) {
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.62, start + 0.03);
      g.gain.setValueAtTime(0.62, start + laengde - 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, start + laengde);
      g.connect(ac.destination);
      [[grund, 0.55], [grund * 0.5, 0.4], [grund * 2, 0.16]].forEach(function (par) {
        var o = ac.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(par[0], start);
        var og = ac.createGain();
        og.gain.value = par[1];
        o.connect(og); og.connect(g);
        o.start(start); o.stop(start + laengde + 0.03);
      });
    }
    for (var i = 0; i < 4; i++) {
      tone(nu + i * 0.64, 0.29, 740);
      tone(nu + i * 0.64 + 0.32, 0.29, 494);
    }
    setTimeout(function () { try { ac.close(); } catch (e) {} }, 3400);
  } catch (e) {}
}

/** Kraftig hornlyd via Web Audio – ingen lydfiler at hoste. */
function hoejLyd() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ac = new Ctx();
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    var nu = ac.currentTime + 0.02;

    function tut(start, laengde) {
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.6, start + 0.04);
      g.gain.setValueAtTime(0.6, start + laengde - 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, start + laengde);
      g.connect(ac.destination);
      [[233, 0.5], [311, 0.34], [466, 0.2], [117, 0.4]].forEach(function (par) {
        var o = ac.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(par[0], start);
        o.frequency.linearRampToValueAtTime(par[0] * 0.94, start + laengde);
        var og = ac.createGain();
        og.gain.value = par[1];
        o.connect(og); og.connect(g);
        o.start(start); o.stop(start + laengde + 0.05);
      });
    }
    tut(nu, 0.5); tut(nu + 0.62, 0.5); tut(nu + 1.24, 1.2);
    setTimeout(function () { try { ac.close(); } catch (e) {} }, 3500);
  } catch (e) { /* lyd er pynt – aldrig noget der må vælte skærmen */ }
}

/**
 * Publikum under løbet. Lydstyrken skrues op undervejs, så hujeriet vokser
 * mod målstregen. Returnerer { svulm, jubel, stop }.
 */
function publikum() {
  var a;
  try { a = new Audio(PUBLIKUM_LYD); } catch (e) { return publikumSyntetisk(); }

  var tween = null;
  var lukket = false;
  var reserve = null;

  function glid(maal, tid, naar) {
    if (tween) { clearInterval(tween); tween = null; }
    var fra = a.volume, t0 = Date.now();
    tween = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / tid);
      try { a.volume = Math.max(0, Math.min(1, fra + (maal - fra) * k)); } catch (e) {}
      if (k >= 1) {
        clearInterval(tween); tween = null;
        if (naar) naar();
      }
    }, 40);
  }

  a.loop = true;
  a.volume = 0;
  var p = a.play();
  if (p && p.catch) {
    p.catch(function () {
      // Vil browseren ikke afspille filen, tages den syntetiske mængde i brug
      if (lukket) return;
      reserve = publikumSyntetisk();
    });
  }
  glid(0.34, 700);

  return {
    /** 0..1 – hvor tæt løbet er på at være afgjort */
    svulm: function (del) {
      if (reserve) return reserve.svulm(del);
      if (lukket) return;
      glid(0.34 + Math.max(0, Math.min(1, del)) * 0.6, 400);
    },
    jubel: function () {
      if (reserve) return reserve.jubel();
      if (lukket) return;
      glid(1, 220);
    },
    stop: function () {
      if (lukket) return;
      lukket = true;
      if (reserve) { reserve.stop(); reserve = null; }
      glid(0, 900, function () {
        try { a.pause(); a.currentTime = 0; } catch (e) {}
      });
    }
  };
}

/**
 * Reservepublikum: filtreret støj med langsomme bølger. Bruges kun hvis
 * browseren ikke vil afspille lydfilen.
 */
function publikumSyntetisk() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    var ac = new Ctx();
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    var nu = ac.currentTime;

    // Hvid støj som råmateriale
    var sek = 4;
    var buf = ac.createBuffer(2, Math.floor(ac.sampleRate * sek), ac.sampleRate);
    for (var k = 0; k < 2; k++) {
      var d = buf.getChannelData(k);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var kilde = ac.createBufferSource();
    kilde.buffer = buf;
    kilde.loop = true;

    // Båndpas omkring stemmeleje, så støjen lyder som mennesker og ikke som regn
    var bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
    var hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 320;

    var mester = ac.createGain();
    mester.gain.setValueAtTime(0.0001, nu);
    mester.gain.exponentialRampToValueAtTime(0.16, nu + 0.7);

    kilde.connect(bp); bp.connect(hp); hp.connect(mester); mester.connect(ac.destination);
    kilde.start();

    // To langsomme bølger oveni, så mængden ånder i stedet for at ligge fladt
    var bolger = [];
    [[0.6, 0.05], [0.23, 0.035]].forEach(function (par) {
      var lfo = ac.createOscillator();
      lfo.frequency.value = par[0];
      var g = ac.createGain();
      g.gain.value = par[1];
      lfo.connect(g); g.connect(mester.gain);
      lfo.start();
      bolger.push(lfo);
    });

    function floejt(t) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1700 + Math.random() * 900, t);
      o.frequency.linearRampToValueAtTime(2500 + Math.random() * 900, t + 0.16);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.32);
    }
    for (var f = 0; f < 7; f++) floejt(nu + 0.8 + Math.random() * 7);

    var lukket = false;
    return {
      /** 0..1 – hvor tæt løbet er på at være afgjort */
      svulm: function (del) {
        if (lukket) return;
        var t = ac.currentTime;
        var maal = 0.16 + Math.max(0, Math.min(1, del)) * 0.2;
        mester.gain.cancelScheduledValues(t);
        mester.gain.setValueAtTime(Math.max(mester.gain.value, 0.0001), t);
        mester.gain.linearRampToValueAtTime(maal, t + 0.4);
      },
      jubel: function () {
        if (lukket) return;
        var t = ac.currentTime;
        bp.frequency.linearRampToValueAtTime(1250, t + 0.3);
        mester.gain.cancelScheduledValues(t);
        mester.gain.setValueAtTime(Math.max(mester.gain.value, 0.0001), t);
        mester.gain.linearRampToValueAtTime(0.45, t + 0.25);
        for (var i = 0; i < 5; i++) floejt(t + Math.random() * 1.6);
      },
      stop: function () {
        if (lukket) return;
        lukket = true;
        var t = ac.currentTime;
        try {
          mester.gain.cancelScheduledValues(t);
          mester.gain.setValueAtTime(Math.max(mester.gain.value, 0.0001), t);
          mester.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
          setTimeout(function () {
            try { kilde.stop(); } catch (e) {}
            bolger.forEach(function (l) { try { l.stop(); } catch (e) {} });
            try { ac.close(); } catch (e) {}
          }, 1300);
        } catch (e) { try { ac.close(); } catch (e2) {} }
      }
    };
  } catch (e) { return null; }
}

/** Kort, venlig klang når man slipper. */
function slapLyd() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ac = new Ctx();
    var nu = ac.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      var t = nu + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.5);
    });
    setTimeout(function () { try { ac.close(); } catch (e) {} }, 1500);
  } catch (e) {}
}

/** Konfetti på et canvas. Returnerer en stop-funktion. */
function konfetti(canvas) {
  var ctx = canvas.getContext('2d');
  var W = canvas.width = canvas.offsetWidth;
  var H = canvas.height = canvas.offsetHeight;
  var farver = ['#7c3aed', '#c026d3', '#e5407f', '#ff8a3d', '#e11d48', '#ffd166', '#ffffff'];
  var stykker = [];
  for (var i = 0; i < 180; i++) {
    stykker.push({
      x: Math.random() * W, y: -30 - Math.random() * H,
      b: 6 + Math.random() * 9, h: 9 + Math.random() * 12,
      fart: 2.2 + Math.random() * 4.5,
      drej: Math.random() * Math.PI * 2, drejFart: (Math.random() - 0.5) * 0.28,
      sving: 0.6 + Math.random() * 2,
      farve: farver[i % farver.length]
    });
  }
  var koerer = true;
  function tegn() {
    if (!koerer) return;
    ctx.clearRect(0, 0, W, H);
    stykker.forEach(function (s) {
      s.y += s.fart;
      s.x += Math.sin(s.y / 32) * s.sving;
      s.drej += s.drejFart;
      if (s.y > H + 30) { s.y = -30; s.x = Math.random() * W; }
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.drej);
      ctx.fillStyle = s.farve;
      ctx.fillRect(-s.b / 2, -s.h / 2, s.b, s.h);
      ctx.restore();
    });
    requestAnimationFrame(tegn);
  }
  tegn();
  return function () { koerer = false; };
}

/**
 * Kører hele væddeløbet: vælg hest → løb → resultat.
 * @param {Object} person
 * @param {Function} naarFaerdig Kaldes når skærmen skal videre.
 */
function koerVaeddeloeb(person, naarFaerdig) {
  clearTimeout(inaktivTimer);
  var antal = Math.max(2, Math.min(HESTE.length, S.spil.hest.antalHeste || 4));
  var heste = HESTE.slice(0, antal);
  var fornavn = String(person.navn).split(' ')[0];
  var valgt = null;
  var stopKonfetti = null;
  var loebTimer = null;
  var alarmTimer = null;
  var maengde = null;

  function ryd() {
    if (stopKonfetti) { stopKonfetti(); stopKonfetti = null; }
    if (loebTimer) { clearInterval(loebTimer); loebTimer = null; }
    if (alarmTimer) { clearTimeout(alarmTimer); alarmTimer = null; }
    if (maengde) { maengde.stop(); maengde = null; }
    stopOrdningsLyd();
    stopGalop();
  }
  function afslut() { ryd(); naarFaerdig(); }

  function hestKort(h, i, klikbar) {
    return '<button class="hestkort"' + (klikbar ? ' data-vaelghest="' + i + '"' : ' disabled') +
           ' style="--f:' + h.farve + '">' +
           '<span class="nr">' + (i + 1) + '</span>' +
           '<span class="dyr">' + loeberIndhold(h.farve, i + 1) + '</span>' +
           '<span class="hnavn">' + esc(h.navn) + '</span></button>';
  }

  /* Løbet starter med en blinkende alarm, så hele rummet opdager det.
   * Blinket kører på 2,5 skift i sekundet – under grænsen for hvad der
   * regnes for sikkert ved fuldskærmsblink.                              */
  function visAlarm() {
    var h = '<div class="alarm" id="alarm">';
    h += '<div class="alarmindhold">';
    h += '<div class="alarmikon">🚨</div>';
    h += '<div class="alarmraab">ÅH NEJ!</div>';
    h += '<div class="alarmtitel">HESTEVÆDDELØB</div>';
    h += '<div class="alarmnavn">' + esc(fornavn) + ' skal vælge en hest</div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;
    alarmLyd();

    var gaaVidere = function () {
      if (!$('alarm')) return;
      clearTimeout(alarmTimer);
      visValg();
    };
    alarmTimer = setTimeout(gaaVidere, 2800);
    $('alarm').onclick = gaaVidere;
  }

  function visValg() {
    var h = '<div class="spil"><div class="spilkort">';
    h += '<div class="spilhat">🚨 ÅH NEJ – HESTEVÆDDELØB</div>';
    h += '<h2>Vælg din hest, ' + esc(fornavn) + '</h2>';
    h += '<p class="spiltekst">Vinder din hest, slipper du. Vælger du forkert, ' +
         'laver du en <strong>ordning</strong>.</p>';
    h += '<div class="hestevalg">' +
         heste.map(function (x, i) { return hestKort(x, i, true); }).join('') + '</div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;
    $('overlaylag').querySelectorAll('[data-vaelghest]').forEach(function (b) {
      b.onclick = function () {
        valgt = parseInt(b.getAttribute('data-vaelghest'), 10);
        visLoeb();
      };
    });
  }

  /* Banen ruller med feltet, så målstregen først dukker op på opløbet –
   * man ser kun et udsnit af banen ad gangen, som i et duck race.        */
  var VINDUE = 26;              // hvor stor en del af banen der er synlig
  var FORAN = VINDUE * 0.65;    // hvor langt inde i billedet føreren ligger

  function kameraFor(leder, maks) {
    if (maks === undefined) maks = 100 - VINDUE;
    return Math.max(0, Math.min(maks, leder - FORAN));
  }
  function tilProcent(x, kamera) {
    return ((x - kamera) / VINDUE) * 94;
  }

  function visLoeb() {
    // Én sammenhængende bane der fylder skærmen, delt op af hvide hegn
    var h = '<div class="spil"><div class="banen" id="banen">';
    heste.forEach(function (x, i) {
      h += '<div class="lane' + (i === valgt ? ' min' : '') + '">' +
           '<span class="lanemaerke"><b style="background:' + x.farve + '">' + (i + 1) +
           '</b>' + esc(x.navn) +
           (i === valgt ? '<em>DIN HEST</em>' : '') + '</span>' +
           '<div class="loeber" id="hest' + i + '">' +
           loeberIndhold(x.farve, i + 1) + '</div></div>';
    });
    h += '<div class="maal" id="maal"><span>MÅL</span></div>';
    h += '</div>';

    h += '<div class="loebhud">';
    h += '<div class="spilhat">OG DE ER AFSTED!</div>';
    h += '<div class="afstand" id="afstand">MÅL OM 100 M</div>';
    h += '<div class="oversigt"><div class="ovbane">';
    heste.forEach(function (x, i) {
      h += '<span class="ovprik" id="ov' + i + '" style="background:' + x.farve + '"></span>';
    });
    h += '<span class="ovmaal"></span></div></div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;

    maengde = publikum();

    var pos = heste.map(function () { return 0; });
    var fart = heste.map(function () { return 0; });
    var vinder = -1;
    var efterMaal = 0;
    var sidsteSvulm = 0;
    var tik = 0;

    /* Løbet har to halvdele. Først svinger hver hest op og ned i sin egen
     * takt, og dem der er bagud får lidt hjælp, så feltet bliver ved med at
     * bytte plads. Fra 45 % slipper hjælpen, bølgerne flader ud, og hver hest
     * går over i sin egen slutspurt — nogle har krudt tilbage, andre ikke.
     * Det er dét der afgør løbet med en synlig længde og ikke et fotofinish.
     * Simuleret over 2000 løb: ~8,5 sekunder, 7 føringsskift, og forspringet
     * er allerede oppe på ~6 enheder (~300 px) når føreren når 90 %, så løbet
     * er afgjort synligt før stregen. Den der fører ved kvartvejs vinder kun
     * i knap en tredjedel af løbene, og alle baner vinder lige ofte.        */
    var grund = heste.map(function () { return 0.92 + Math.random() * 0.10; });
    var fase  = heste.map(function () { return Math.random() * Math.PI * 2; });
    var amp   = heste.map(function () { return 0.35 + Math.random() * 0.20; });
    var takt  = heste.map(function () { return 16 + Math.random() * 12; });
    var spurt = heste.map(function () { return -0.60 + Math.random() * 1.90; });

    function tegn() {
      var foerste = 0;
      for (var i = 0; i < pos.length; i++) if (pos[i] > pos[foerste]) foerste = i;
      // Efter mål følger kameraet vinderen, så målstregen ruller bagud
      var kamera = vinder >= 0 ? kameraFor(pos[vinder], 1e9) : kameraFor(pos[foerste]);

      var banen = $('banen');
      if (banen) {
        // Hegnet står længere væk end banen og ruller derfor langsommere
        banen.style.setProperty('--rul', (-kamera * 17) + 'px');
        banen.style.setProperty('--rul2', (-kamera * 9) + 'px');
      }
      for (var j = 0; j < pos.length; j++) {
        var el = $('hest' + j);
        if (el) {
          var p = tilProcent(pos[j], kamera);
          el.style.left = Math.max(-10, Math.min(100, p)) + '%';
          el.style.opacity = p < -8 ? '0' : (p < 0 ? '0.4' : '1');
        }
        var ov = $('ov' + j);
        if (ov) ov.style.left = Math.min(100, pos[j]) + '%';
      }
      var maal = $('maal');
      if (maal) maal.style.left = tilProcent(100, kamera) + '%';
      if (vinder < 0) {
        var af = $('afstand');
        if (af) af.textContent = 'MÅL OM ' + Math.max(0, Math.round(100 - pos[foerste])) + ' M';
      }
      return foerste;
    }
    tegn();

    /** Markerer vinderen tydeligt og lader de øvrige falde i baggrunden. */
    function udpegVinder(nr) {
      var lanes = document.querySelectorAll('.lane');
      for (var i = 0; i < lanes.length; i++) {
        lanes[i].classList.add(i === nr ? 'vinder' : 'taber');
      }
      var m = lanes[nr] && lanes[nr].querySelector('.lanemaerke');
      if (m) m.insertAdjacentHTML('beforeend', '<i class="sejr">🏆 VINDER</i>');
      var af = $('afstand');
      if (af) {
        af.textContent = '🏆 ' + heste[nr].navn.toUpperCase() + ' VINDER!';
        af.classList.add('vandt');
      }
      var hat = document.querySelector('.loebhud .spilhat');
      if (hat) hat.textContent = 'OVER STREGEN';
    }

    loebTimer = setInterval(function () {
      if (vinder < 0) {
        tik++;
        // Føringen låses før feltet opdateres, ellers får de bageste baner
        // en større indhentning og vinder systematisk oftere
        var lederPos = 0;
        for (var a = 0; a < pos.length; a++) if (pos[a] > lederPos) lederPos = pos[a];

        // 0 indtil opløbet er nået, derefter glidende op til 1 ved mål
        var sluttet = Math.max(0, Math.min(1, (lederPos / 100 - 0.35) / 0.65));
        var hjaelp = sluttet > 0 ? 0 : 0.018;   // slipper når slutspurten går ind

        for (var i = 0; i < pos.length; i++) {
          var svaj = amp[i] * (1 - 0.85 * sluttet);
          var raa = grund[i] * (1 + spurt[i] * sluttet)
                  * (1 + svaj * Math.sin(2 * Math.PI * tik / takt[i] + fase[i]))
                  + (Math.random() - 0.5) * 0.25;
          // Ingen hest må sjokke – mindstefarten holder feltet i galop
          fart[i] = Math.max(0.45, raa) + (lederPos - pos[i]) * hjaelp;
          pos[i] += fart[i];
        }
        var foerste = tegn();

        // Hujeriet vokser i takt med at føringen nærmer sig målstregen
        var del = Math.floor(pos[foerste] / 20);
        if (maengde && del > sidsteSvulm) {
          sidsteSvulm = del;
          maengde.svulm(pos[foerste] / 100);
        }
        if (pos[foerste] >= 100) {
          // Flere kan krydse i samme tik. Den der nåede længst forbi stregen
          // i forhold til sin fart, var først over – ellers ville vinderen
          // blive afgjort af rækkefølgen i listen.
          var bedst = foerste, tidligst = -1;
          for (var c = 0; c < pos.length; c++) {
            if (pos[c] < 100) continue;
            var naar = (pos[c] - 100) / Math.max(0.001, fart[c]);
            if (naar > tidligst) { tidligst = naar; bedst = c; }
          }
          vinder = bedst;
          if (maengde) maengde.jubel();
          udpegVinder(vinder);
        }
        return;
      }

      // Vinderen løber videre alene; de øvrige bremser op ved stregen
      efterMaal++;
      pos[vinder] += 2.5;
      for (var k = 0; k < pos.length; k++) {
        if (k === vinder) continue;
        fart[k] *= 0.87;
        pos[k] = Math.min(100, pos[k] + fart[k]);
      }
      tegn();

      if (efterMaal >= 16) {
        clearInterval(loebTimer);
        loebTimer = null;
        setTimeout(function () { visResultat(vinder); }, 500);
      }
    }, 100);
  }

  function visResultat(vinder) {
    var vandt = vinder === valgt;

    // Gemmes til årsstatistikken. Testløb fra administrationen har ingen
    // person og tælles derfor ikke med.
    if (person && person.id) {
      kald('registrerSpil', person.id, heste[valgt].navn, heste[vinder].navn, vandt)
        .catch(function () { /* et tabt spilresultat må aldrig vælte kiosken */ });
    }
    var h = '<div class="spil ' + (vandt ? 'slap' : 'ordning') + '">';
    if (!vandt) h += '<canvas class="konfetti" id="konfetti"></canvas>';
    h += '<div class="spilkort resultat">';
    if (vandt) {
      h += '<div class="kaempe">🏆</div>';
      h += '<h2>' + esc(heste[vinder].navn) + ' vandt!</h2>';
      h += '<p class="spiltekst">Du slap, ' + esc(fornavn) + '. Ingen ordning.</p>';
    } else {
      h += '<div class="kaempe">🍻</div>';
      h += '<h2 class="raab">ORDNING!</h2>';
      h += '<p class="spiltekst">' + esc(heste[vinder].navn) + ' vandt — du satsede på ' +
           esc(heste[valgt].navn) + '.</p>';
      h += '<div class="hvem">' + esc(fornavn) + ' laver en ordning</div>';
    }
    h += '<button class="stor-knap" id="spil-videre">Videre</button>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;

    if (maengde) { maengde.stop(); maengde = null; }
    if (vandt) {
      slapLyd();
    } else {
      afspilOrdningsLyd();
      var c = $('konfetti');
      if (c) stopKonfetti = konfetti(c);
    }
    $('spil-videre').onclick = afslut;
    setTimeout(function () { if ($('spil-videre')) afslut(); }, vandt ? 7000 : 12000);
  }

  startGalop();
  visAlarm();
}

/** Talindtastning med store knapper. Returnerer Promise<number|null>. */
function numpad(opts) {
  return new Promise(function (res) {
    var vaerdi = (opts.start !== undefined && opts.start !== null) ? String(opts.start) : '';

    function visTal() {
      return esc(vaerdi === '' ? '0' : vaerdi) +
        (opts.enhed ? ' <span style="font-size:22px;color:var(--tekst-svag);margin-left:8px">' +
         esc(opts.enhed) + '</span>' : '');
    }

    var h = '<div class="overlay"><div class="dialog">';
    h += '<h2>' + esc(opts.titel) + '</h2>';
    if (opts.hjaelp) h += '<p class="hjaelp">' + esc(opts.hjaelp) + '</p>';
    h += '<div class="numdisplay" id="numvis"></div>';
    h += '<div class="numpad">';
    [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach(function (n) {
      h += '<button data-num="' + n + '">' + n + '</button>';
    });
    h += opts.decimaler ? '<button data-num=",">,</button>' : '<button data-num="00">00</button>';
    h += '<button data-num="0">0</button>';
    h += '<button data-num="slet">⌫</button>';
    h += '</div>';
    h += '<div class="knapper">' +
         '<button class="stor-knap graa" data-num="annuller">Annullér</button>' +
         '<button class="stor-knap" data-num="ok">OK</button></div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;
    $('numvis').innerHTML = visTal();

    $('overlaylag').querySelectorAll('[data-num]').forEach(function (b) {
      b.onclick = function () {
        var v = b.getAttribute('data-num');
        if (v === 'annuller') { lukDialog(); res(null); return; }
        if (v === 'ok') {
          lukDialog();
          var tal = parseFloat(String(vaerdi === '' ? '0' : vaerdi).replace(',', '.'));
          res(isNaN(tal) ? 0 : tal);
          return;
        }
        if (v === 'slet') vaerdi = vaerdi.slice(0, -1);
        else if (v === ',') { if (vaerdi.indexOf(',') === -1) vaerdi = (vaerdi || '0') + ','; }
        else vaerdi = (vaerdi === '0' ? '' : vaerdi) + v;
        if (vaerdi.length > 8) vaerdi = vaerdi.substring(0, 8);
        $('numvis').innerHTML = visTal();
      };
    });
  });
}

/* ---------- PIN ---------- */

function bedOmPin() {
  return new Promise(function (res) {
    var kode = '';
    var tjekker = false;
    function tegn() {
      var prikker = '';
      for (var i = 0; i < 4; i++) {
        prikker += '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;' +
          'margin:0 7px;background:' + (i < kode.length ? 'var(--gron)' : 'var(--kant)') + '"></span>';
      }
      var h = '<div class="overlay"><div class="dialog" style="max-width:420px">';
      h += '<h2>Administration</h2><p class="hjaelp">' + (tjekker ? 'Tjekker koden…' : 'Indtast PIN-kode') + '</p>';
      h += '<div class="numdisplay" style="justify-content:center">' + prikker + '</div>';
      h += '<div class="numpad">';
      [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach(function (n) { h += '<button data-pin="' + n + '">' + n + '</button>'; });
      h += '<button data-pin="annuller">✕</button><button data-pin="0">0</button>' +
           '<button data-pin="slet">⌫</button>';
      h += '</div></div></div>';
      $('overlaylag').innerHTML = h;
      $('overlaylag').querySelectorAll('[data-pin]').forEach(function (b) {
        b.onclick = function () {
          var v = b.getAttribute('data-pin');
          if (tjekker) return;
          if (v === 'annuller') { lukDialog(); res(null); return; }
          if (v === 'slet') { kode = kode.slice(0, -1); tegn(); return; }
          kode += v;
          tegn();
          if (kode.length >= 4) {
            var forsoeg = kode;
            tjekker = true;
            tegn();
            kald('tjekPin', forsoeg).then(function (ok) {
              tjekker = false;
              if (ok) { lukDialog(); res(forsoeg); }
              else { kode = ''; toast('Forkert PIN-kode', true); tegn(); }
            }).catch(function () { tjekker = false; kode = ''; toast('Ingen forbindelse', true); tegn(); });
          }
        };
      });
    }
    tegn();
  });
}

/* ---------- Lager ---------- */

function miniBilledeHtml(p) {
  if (billedeFor(p.id)) return '<div class="minibillede ' + billedKlasse(p.id) + '"></div>';
  return '<div class="emoji">' + esc(p.emoji) + '</div>';
}

function renderLager() {
  var produkter = aktiveProdukter();
  var antalVarer = 0, vaerdi = 0;
  produkter.forEach(function (p) {
    var l = Math.max(p.lager, 0);
    antalVarer += l;
    vaerdi += l * p.pris;
  });
  var udsolgte = produkter.filter(function (p) { return p.lager <= 0; });
  var lave = produkter.filter(function (p) { return p.lager > 0 && p.lager <= p.minLager; });

  var h = '';
  h += '<div class="noegletal">';
  h += '<div class="kort"><div class="v">' + antalVarer + '</div><div class="l">Varer på lager</div></div>';
  h += '<div class="kort"><div class="v">' + esc(kr(vaerdi)) + '</div><div class="l">Salgsværdi</div></div>';
  h += '<div class="kort' + (lave.length ? ' advarsel' : '') + '"><div class="v">' + lave.length +
       '</div><div class="l">Snart tomme</div></div>';
  h += '<div class="kort' + (udsolgte.length ? ' fare' : '') + '"><div class="v">' + udsolgte.length +
       '</div><div class="l">Udsolgte</div></div>';
  h += '</div>';

  h += '<div class="knaprad">';
  h += '<button class="stor-knap blaa" data-indkoeb="1">🛒 Registrér indkøb</button>';
  h += '<button class="stor-knap graa" data-lagerlog="1">🕐 Bevægelser</button>';
  h += '</div>';

  if (udsolgte.length || lave.length) {
    h += '<div class="sektion"><h3>Indkøbsliste</h3>';
    udsolgte.concat(lave).forEach(function (p) {
      var mangler = Math.max(p.minLager * 2 - p.lager, 1);
      h += '<div class="raekke">' + miniBilledeHtml(p) +
           '<div class="midt"><div class="titel">' + esc(p.navn) + '</div>' +
           '<div class="under">' + (p.lager <= 0 ? 'Udsolgt' : p.lager + ' tilbage') +
           ' · foreslået indkøb: ' + mangler + ' stk.</div></div>' +
           '<span class="maerkat ' + (p.lager <= 0 ? 'rod' : 'gul') + '">' +
           (p.lager <= 0 ? 'Udsolgt' : 'Lavt') + '</span>' +
           '</div>';
    });
    h += '</div>';
  }

  h += '<div class="sektion"><h3>Alle varer</h3>';
  produkter.slice().sort(function (a, b) { return a.lager - b.lager; }).forEach(function (p) {
    h += '<div class="raekke">' + miniBilledeHtml(p) +
         '<div class="midt"><div class="titel">' + esc(p.navn) + '</div>' +
         '<div class="under">' + esc(kr(p.pris)) + ' · min. ' + p.minLager + ' stk.</div></div>' +
         '<div class="hoejre">' +
         '<button class="rundknap" data-juster="' + esc(p.id) + '" data-delta="-1">−</button>' +
         '<div class="lagertal ' + lagerKlasse(p) + '">' + p.lager + '</div>' +
         '<button class="rundknap" data-juster="' + esc(p.id) + '" data-delta="1">+</button>' +
         '<button class="stor-knap graa lille" data-paafyld="' + esc(p.id) + '">Påfyld</button>' +
         '<button class="stor-knap graa lille" data-optael="' + esc(p.id) + '">Optæl</button>' +
         '</div></div>';
  });
  h += '</div>';
  return h;
}

function visIndkoeb() {
  var produkter = aktiveProdukter().slice().sort(function (a, b) { return a.lager - b.lager; });
  var antal = {};
  produkter.forEach(function (p) { antal[p.id] = 0; });

  function tegn() {
    var h = '<div class="overlay"><div class="dialog bred">';
    h += '<h2>Registrér indkøb</h2>';
    h += '<p class="hjaelp">Skriv hvor mange stk. du har lagt i køleskabet af hver vare.</p>';
    produkter.forEach(function (p) {
      h += '<div class="raekke">' + miniBilledeHtml(p) +
           '<div class="midt"><div class="titel">' + esc(p.navn) + '</div>' +
           '<div class="under">' + p.lager + ' på lager nu</div></div>' +
           '<div class="hoejre">' +
           '<button class="rundknap" data-ind-minus="' + esc(p.id) + '">−</button>' +
           '<div class="lagertal">' + (antal[p.id] ? '+' + antal[p.id] : '0') + '</div>' +
           '<button class="rundknap" data-ind-plus="' + esc(p.id) + '">+</button>' +
           '</div></div>';
    });
    h += '<div class="knapper">' +
         '<button class="stor-knap graa" id="ind-annuller">Annullér</button>' +
         '<button class="stor-knap" id="ind-gem">Læg på lager</button></div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;

    $('overlaylag').querySelectorAll('[data-ind-plus]').forEach(function (b) {
      b.onclick = function () { antal[b.getAttribute('data-ind-plus')] += 1; tegn(); };
    });
    $('overlaylag').querySelectorAll('[data-ind-minus]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-ind-minus');
        antal[id] = Math.max(0, antal[id] - 1); tegn();
      };
    });
    $('ind-annuller').onclick = lukDialog;
    $('ind-gem').onclick = function () {
      var linjer = Object.keys(antal).filter(function (id) { return antal[id] > 0; })
        .map(function (id) { return { produktId: id, antal: antal[id] }; });
      if (!linjer.length) { lukDialog(); return; }
      kald('bulkPaafyld', S.pin, linjer, 'Indkøb')
        .then(function (p) {
          S.produkter = p; lukDialog(); render();
          toast('Lager opdateret med ' + linjer.length + ' varer');
        })
        .catch(function (e) { toast(e.message, true); });
    };
  }
  tegn();
}

/**
 * Sletning af en vare. Konsekvenserne hentes først, så man kan se hvad man
 * går i gang med – og hvad der ikke sker: historikken bliver stående.
 */
function bekraeftSletProdukt(id, navn) {
  kald('hentProduktBrug', S.pin, id).then(function (brug) {
    var h = '<div class="overlay"><div class="dialog">';
    h += '<h2>Slet ' + esc(brug.navn) + '?</h2>';
    h += '<p class="hjaelp">Varen forsvinder helt fra kiosken og fra listerne.</p>';

    h += '<div class="sletliste">';
    if (brug.koebLinjer) {
      h += '<div class="sletlinje beholdes"><b>✓ Historikken beholdes</b>' +
           '<span>' + brug.solgt + ' stk. solgt over ' + brug.maaneder +
           (brug.maaneder === 1 ? ' måned' : ' måneder') +
           ' står uændret i opgørelserne — hvert køb husker selv navn og pris.</span></div>';
    } else {
      h += '<div class="sletlinje beholdes"><b>✓ Ingen køb registreret</b>' +
           '<span>Varen er aldrig blevet solgt.</span></div>';
    }
    if (brug.lager > 0) {
      h += '<div class="sletlinje advarsel"><b>⚠️ ' + brug.lager + ' stk. på lager</b>' +
           '<span>Beholdningen forsvinder fra lageroversigten. Står der stadig ' +
           'varer i køleskabet, så tæl dem ud først.</span></div>';
    }
    if (brug.tilstande.length) {
      h += '<div class="sletlinje advarsel"><b>⚠️ Bruges i ' +
           esc(brug.tilstande.join(', ')) + '</b>' +
           '<span>Varen fjernes fra ' +
           (brug.tilstande.length === 1 ? 'den tilstand' : 'de tilstande') + '.</span></div>';
    }
    if (brug.iSpil) {
      h += '<div class="sletlinje advarsel"><b>⚠️ Udløser hestevæddeløb</b>' +
           '<span>Den fjernes fra spillets udløsere.</span></div>';
    }
    h += '<div class="sletlinje beholdes"><b>✓ Lagerbevægelser beholdes</b>' +
         '<span>Påfyldning og optælling bliver stående som revisionsspor.</span></div>';
    h += '</div>';

    h += '<p class="hjaelp">Vil du kun have den ud af kiosken, kan du i stedet ' +
         'fjerne fluebenet <em>Vis i kiosken</em> — så bliver den i listerne.</p>';
    h += '<div class="knapper">' +
         '<button class="stor-knap graa" id="sp-fortryd">Behold varen</button>' +
         '<button class="stor-knap roed" id="sp-slet">Slet for altid</button></div>';
    h += '</div></div>';
    $('overlaylag2').innerHTML = h;

    $('sp-fortryd').onclick = function () { $('overlaylag2').innerHTML = ''; };
    $('sp-slet').onclick = function () {
      $('sp-slet').disabled = true;
      kald('sletProdukt', S.pin, id)
        .then(function (svar) {
          S.produkter = svar.produkter;
          if (svar.tilstande) S.tilstande = svar.tilstande;
          delete S.billeder[id];
          gemBilledCache();
          $('overlaylag2').innerHTML = '';
          lukDialog();
          render();
          toast(svar.navn + ' er slettet');
        })
        .catch(function (e) {
          if ($('sp-slet')) $('sp-slet').disabled = false;
          toast(e.message, true);
        });
    };
  }).catch(function (e) { toast(e.message, true); });
}

function aendrPris(id) {
  var p = produktMed(id);
  numpad({ titel: 'Pris på ' + p.navn, hjaelp: 'Nuværende pris: ' + kr(p.pris),
           start: p.pris, decimaler: true, enhed: S.indst.valuta })
    .then(function (v) {
      if (v === null) return;
      kald('gemProdukt', S.pin, {
        id: p.id, navn: p.navn, pris: v, kostpris: p.kostpris, kategori: p.kategori,
        minLager: p.minLager, emoji: p.emoji, pant: p.pant, aktiv: p.aktiv
      }).then(function (svar) {
        S.produkter = svar.produkter; render(); toast(p.navn + ' koster nu ' + kr(v));
      }).catch(function (e) { toast(e.message, true); });
    });
}

/* ---------- Prestilstande ---------- */

var TILSTAND_EMOJIS = ['🎉', '🍻', '🥳', '🎊', '🔥', '⭐', '🌞', '🎄', '🎃', '💸', '🏆', '🎸'];
var TILSTAND_FARVER = ['#8b3fd6', '#c026d3', '#e5407f', '#ff8a3d',
                       '#7c3aed', '#e11d48', '#ea580c', '#a21caf'];

function tilstandMed(id) {
  for (var i = 0; i < S.tilstande.length; i++) if (S.tilstande[i].id === id) return S.tilstande[i];
  return null;
}

function renderTilstande() {
  var t = S.tilstand;
  var h = '';

  h += '<div class="tilstandstatus"' +
       (t ? ' style="border-color:' + esc(t.farve) + '"' : '') + '>';
  h += '<div class="stort-emoji">' + (t ? esc(t.emoji) : '💰') + '</div>';
  if (t) {
    h += '<div class="midt"><div class="titel">' + esc(t.navn) + ' er slået til</div>' +
         '<div class="under">' + esc(tilstandTekst(t)) + esc(restTekst(t)) + '</div></div>';
    h += '<button class="stor-knap roed" data-sluktilstand="1">Slå fra</button>';
  } else {
    h += '<div class="midt"><div class="titel">Normale priser</div>' +
         '<div class="under">Ingen tilstand er slået til lige nu.</div></div>';
  }
  h += '</div>';

  h += '<div class="knaprad"><button class="stor-knap" data-nytilstand="1">＋ Ny tilstand</button></div>';

  if (!S.tilstande.length) {
    h += '<div class="tom-besked"><div class="stor">🎉</div>Ingen tilstande endnu.<br>' +
         'Lav fx en "Festival", der lægger 50% oven i drikkevarerne.</div>';
    return h;
  }

  S.tilstande.forEach(function (x) {
    var erAktiv = t && t.id === x.id;
    h += '<div class="raekke"' + (erAktiv ? ' style="border-color:' + esc(x.farve) + '"' : '') + '>' +
         '<div class="emoji">' + esc(x.emoji) + '</div>' +
         '<div class="midt"><div class="titel">' + esc(x.navn) +
         (erAktiv ? ' <span class="maerkat gron">aktiv</span>' : '') + '</div>' +
         '<div class="under">' + esc(tilstandTekst(x)) + '</div></div>' +
         '<div class="hoejre">' +
         (erAktiv
           ? '<button class="stor-knap roed lille" data-sluktilstand="1">Slå fra</button>'
           : '<button class="stor-knap lille" data-taendtilstand="' + esc(x.id) + '">Slå til</button>') +
         '<button class="ikonknap" data-redigertilstand="' + esc(x.id) + '">✏️</button>' +
         '</div></div>';
  });

  h += '<p class="hjaelp" style="margin-top:14px">Kun én tilstand kan være slået til ad gangen. ' +
       'Prisen bliver gemt på hvert køb, så en regning altid viser det, der faktisk blev betalt.</p>';
  return h + renderSpil();
}

function renderSpil() {
  var sp = S.spil.hest;
  var gs = String(sp.gaelderFor || '');
  var hvad = gs.toUpperCase() === 'INGEN' ? 'ingen varer – vælg nogen under Indstil'
    : ((!sp.gaelderFor || gs.toUpperCase() === 'ALLE') ? 'alle varer' : sp.gaelderFor);
  var h = '<div class="sektion"><h3>Spil</h3>';
  h += '<div class="tilstandstatus"' + (sp.aktiv ? ' style="border-color:#e5407f"' : '') + '>';
  h += '<div class="stort-emoji">🐎</div>';
  h += '<div class="midt"><div class="titel">Hestevæddeløb' +
       (sp.aktiv ? ' <span class="maerkat gron">slået til</span>' : '') + '</div>' +
       '<div class="under">' + sp.chance + '% chance ved køb af ' + esc(hvad) +
       ' · ' + sp.antalHeste + ' heste</div></div>';
  h += '<div class="hoejre">' +
       '<button class="stor-knap graa lille" data-spilindstil="1">Indstil</button>' +
       '<button class="stor-knap ' + (sp.aktiv ? 'roed ' : '') + 'lille" data-spiltaend="' +
       (sp.aktiv ? '0' : '1') + '">' + (sp.aktiv ? 'Slå fra' : 'Slå til') + '</button>' +
       '</div></div>';
  h += '<p class="hjaelp">Når nogen køber en vare der er med i spillet, er der ' + sp.chance +
       '% chance for at et væddeløb popper op. Rammer man forkert hest, kommer der ' +
       'høj lyd og konfetti — og en ordning. Det påvirker hverken pris eller regnskab.</p>';
  h += '</div>';
  return h;
}

/** Skriver klip-listen som HEST_F1..n og fjerner overskydende pladser. */
function gemKlipListe(liste) {
  var kaede = Promise.resolve();
  for (var i = 0; i < HEST_MAKS_KLIP; i++) {
    (function (idx) {
      kaede = kaede.then(function () {
        var noegle = 'HEST_F' + (idx + 1);
        if (idx < liste.length) {
          if (S.billeder[noegle] === liste[idx]) return;
          return kald('gemBillede', S.pin, noegle, liste[idx]).then(function () {
            S.billeder[noegle] = liste[idx];
          });
        }
        if (!S.billeder[noegle]) return;
        return kald('sletBillede', S.pin, noegle).then(function () {
          delete S.billeder[noegle];
        });
      });
    })(i);
  }
  return kaede.then(function () { gemBilledCache(); nulstilBilledStempel(); });
}

function visSpilIndstillinger() {
  var sp = S.spil.hest;
  var chance = sp.chance;
  var antalHeste = sp.antalHeste;

  var kategorier = [];
  S.produkter.forEach(function (p) {
    if (p.kategori && kategorier.indexOf(p.kategori) === -1) kategorier.push(p.kategori);
  });
  kategorier.sort(function (a, b) { return a.localeCompare(b, 'da'); });
  var varer = S.produkter.filter(function (p) { return p.aktiv; })
    .sort(function (a, b) { return a.navn.localeCompare(b.navn, 'da'); });

  var spTekst = String(sp.gaelderFor || 'ALLE');
  var alle = spTekst.toUpperCase() === 'ALLE';
  var valgte = (alle || spTekst.toUpperCase() === 'INGEN') ? [] : spTekst.split(',')
    .map(function (x) { return x.trim(); }).filter(String);
  function erValgt(n) {
    return valgte.some(function (v) { return v.toLowerCase() === n.toLowerCase(); });
  }

  var h = '<div class="overlay"><div class="dialog bred">';
  h += '<h2>🐎 Hestevæddeløb</h2>';
  h += '<p class="hjaelp">Et spil, ikke en pris. Det ændrer hverken hvad folk betaler ' +
       'eller hvad der står i månedsopgørelsen.</p>';

  h += '<div class="felt-raekke">' +
       '<div class="felt"><label>Chance pr. køb (%)</label>' +
       '<input id="sp-chance" type="number" min="0" max="100" inputmode="numeric" value="' +
       chance + '"></div>' +
       '<div class="felt"><label>Antal heste</label>' +
       '<input id="sp-heste" type="number" min="2" max="6" inputmode="numeric" value="' +
       antalHeste + '"></div></div>';

  h += '<div class="felt"><label>Udløses ved køb af</label>' +
       '<div class="gruppevaelger" id="sp-gaelder">';
  h += '<button type="button" class="chip' + (alle ? ' aktiv' : '') +
       '" data-g="ALLE">Alle varer</button>';
  kategorier.forEach(function (k) {
    h += '<button type="button" class="chip' + (erValgt(k) ? ' aktiv' : '') +
         '" data-g="' + esc(k) + '">' + esc(k) + '</button>';
  });
  h += '</div><div class="gruppevaelger" style="margin-top:9px" id="sp-varer">';
  varer.forEach(function (p) {
    h += '<button type="button" class="chip lille' + (erValgt(p.navn) ? ' aktiv' : '') +
         '" data-g="' + esc(p.navn) + '">' + esc(p.emoji) + ' ' + esc(p.navn) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="felt"><label>Hestebilleder (valgfrit)</label>' +
       '<div class="klipraekke" id="sp-klip"></div>' +
       '<p class="hjaelp" style="margin:9px 0 0">Læg 2–8 billeder ind af en hest i galop, ' +
       'så bruges de i stedet for de indbyggede galopklip. ' +
       'Rækkefølgen er den du vælger dem i.</p>' +
       '<input type="file" accept="image/*" multiple id="sp-klipfil" style="display:none"></div>';

  h += '<div class="knaprad" style="margin:4px 0 0">' +
       '<button class="stor-knap graa" id="sp-proev">▶ Prøv et løb</button></div>';
  h += '<div class="knapper">' +
       '<button class="stor-knap graa" id="sp-annuller">Annullér</button>' +
       '<button class="stor-knap" id="sp-gem">Gem</button></div>';
  h += '</div></div>';
  $('overlaylag').innerHTML = h;

  function opdater() {
    $('sp-gaelder').querySelector('[data-g="ALLE"]').className = 'chip' + (valgte.length ? '' : ' aktiv');
    [].concat(
      Array.prototype.slice.call($('sp-gaelder').querySelectorAll('[data-g]')),
      Array.prototype.slice.call($('sp-varer').querySelectorAll('[data-g]'))
    ).forEach(function (b) {
      var v = b.getAttribute('data-g');
      if (v === 'ALLE') return;
      var lille = b.parentNode.id === 'sp-varer' ? ' lille' : '';
      b.className = 'chip' + lille + (erValgt(v) ? ' aktiv' : '');
    });
  }
  function kobl(b) {
    b.onclick = function () {
      var v = b.getAttribute('data-g');
      if (v === 'ALLE') valgte = [];
      else if (erValgt(v)) {
        valgte = valgte.filter(function (x) { return x.toLowerCase() !== v.toLowerCase(); });
      } else valgte.push(v);
      opdater();
    };
  }
  $('sp-gaelder').querySelectorAll('[data-g]').forEach(kobl);
  $('sp-varer').querySelectorAll('[data-g]').forEach(kobl);

  function tegnKlip() {
    var klip = hestKlipEgne();
    var k = '';
    klip.forEach(function (b, i) {
      k += '<div class="klipmini"><img src="' + b + '" alt="">' +
           '<span class="kliptal">' + (i + 1) + '</span>' +
           '<button type="button" class="klipslet" data-sletklip="' + i + '">✕</button></div>';
    });
    if (klip.length < HEST_MAKS_KLIP) {
      k += '<button type="button" class="klipadd" id="sp-tilfoej">＋<span>Tilføj</span></button>';
    }
    if (!klip.length) {
      k += '<span class="hjaelp" style="align-self:center;margin:0 0 0 6px">' +
           'Ingen egne billeder – de indbyggede galopklip bruges</span>';
    }
    $('sp-klip').innerHTML = k;

    var tilfoej = $('sp-tilfoej');
    if (tilfoej) tilfoej.onclick = function () { $('sp-klipfil').click(); };
    $('sp-klip').querySelectorAll('[data-sletklip]').forEach(function (b) {
      b.onclick = function () {
        var i = parseInt(b.getAttribute('data-sletklip'), 10);
        var ny = hestKlipEgne();
        ny.splice(i, 1);
        b.disabled = true;
        gemKlipListe(ny).then(tegnKlip).catch(function (e) { toast(e.message, true); });
      };
    });
  }
  tegnKlip();

  $('sp-klipfil').onchange = function () {
    var filer = Array.prototype.slice.call($('sp-klipfil').files || []);
    $('sp-klipfil').value = '';
    if (!filer.length) return;
    var plads = HEST_MAKS_KLIP - hestKlipEgne().length;
    if (filer.length > plads) {
      filer = filer.slice(0, plads);
      toast('Der er kun plads til ' + HEST_MAKS_KLIP + ' billeder');
    }
    toast('Behandler ' + filer.length + (filer.length === 1 ? ' billede…' : ' billeder…'));
    var nye = [];
    filer.reduce(function (p, f) {
      return p.then(function () {
        return laesBilledfil(f, true).then(function (d) { nye.push(d); })
          .catch(function (e) { toast(f.name + ': ' + e.message, true); });
      });
    }, Promise.resolve()).then(function () {
      if (!nye.length) return;
      return gemKlipListe(hestKlipEgne().concat(nye)).then(function () {
        tegnKlip();
        toast(nye.length + ' billede' + (nye.length === 1 ? '' : 'r') + ' lagt ind');
      });
    }).catch(function (e) { toast(e.message, true); });
  };

  $('sp-proev').onclick = function () {
    var tidligere = S.spil.hest.antalHeste;
    S.spil.hest.antalHeste = Math.max(2, Math.min(6, parseInt($('sp-heste').value, 10) || 4));
    koerVaeddeloeb({ navn: 'Testperson' }, function () {
      S.spil.hest.antalHeste = tidligere;
      visSpilIndstillinger();
    });
  };
  $('sp-annuller').onclick = lukDialog;
  $('sp-gem').onclick = function () {
    var c = Math.max(0, Math.min(100, parseInt($('sp-chance').value, 10) || 0));
    var n = Math.max(2, Math.min(6, parseInt($('sp-heste').value, 10) || 4));
    var g = valgte.length ? valgte.join(', ') : 'ALLE';
    $('sp-gem').disabled = true;
    kald('saetIndstilling', S.pin, 'SpilHestChance', c)
      .then(function () { return kald('saetIndstilling', S.pin, 'SpilHestAntal', n); })
      .then(function () { return kald('saetIndstilling', S.pin, 'SpilHestGælder', g); })
      .then(function () { return kald('hentSpil'); })
      .then(function (sp2) {
        S.spil = sp2; lukDialog(); render(); toast('Gemt');
      })
      .catch(function (e) {
        if ($('sp-gem')) $('sp-gem').disabled = false;
        toast(e.message, true);
      });
  };
}

/** Vælg hvor længe tilstanden skal køre – med automatisk sluk. */
function visAktiverTilstand(id) {
  var t = tilstandMed(id);
  if (!t) return;
  var h = '<div class="overlay"><div class="dialog">';
  h += '<h2>' + esc(t.emoji + ' ' + t.navn) + '</h2>';
  h += '<p class="hjaelp">' + esc(tilstandTekst(t)) +
       '. Hvor længe skal den være slået til?</p>';
  h += '<div class="varighed">';
  [[4, '4 timer'], [8, '8 timer'], [12, '12 timer'], [24, '1 døgn'],
   [72, 'Hele weekenden'], [0, 'Til jeg slår den fra']].forEach(function (v) {
    h += '<button class="stor-knap graa" data-timer="' + v[0] + '">' + esc(v[1]) + '</button>';
  });
  h += '</div>';
  h += '<div class="knapper"><button class="stor-knap graa" id="at-annuller">Annullér</button></div>';
  h += '</div></div>';
  $('overlaylag').innerHTML = h;

  $('at-annuller').onclick = lukDialog;
  $('overlaylag').querySelectorAll('[data-timer]').forEach(function (b) {
    b.onclick = function () {
      var timer = parseInt(b.getAttribute('data-timer'), 10);
      kald('aktiverTilstand', S.pin, id, timer)
        .then(function (svar) {
          S.tilstande = svar.tilstande;
          S.tilstand = svar.aktiv;
          lukDialog(); render();
          toast(t.navn + ' er slået til' + (timer ? ' i ' + timer + ' timer' : ''));
        })
        .catch(function (e) { toast(e.message, true); });

}

function renderAdminPersoner() {

var FARVER = ['#7c3aed', '#9333ea', '#a21caf', '#c026d3', '#db2777',

function redigerPerson(id) {
  var p = id ? personMed(id) : null;
  if (!p) {
    p = { id: '', navn: '', gruppe: S.indst.standardGruppe || 'Beboere',
          farve: FARVER[S.personer.length % FARVER.length], aktiv: true };
  }
  var valgtFarve = p.farve;
  var valgtGruppe = p.gruppe || 'Beboere';
  var billedTilstand = { billede: id ? billedeFor(id) : '', aendret: false };

  var alleGrupper = (S.indst.grupper || []).slice();
  brugteGrupper().forEach(function (g) { if (alleGrupper.indexOf(g) === -1) alleGrupper.push(g); });

       '" placeholder="fx Anders Christensen"></div>';

  alleGrupper.forEach(function (g) {
    h += '<button type="button" class="chip' + (g === valgtGruppe ? ' aktiv' : '') +
         '" data-g="' + esc(g) + '">' + esc(g) + '</button>';
  });
  h += '</div></div>';
  h += billedFelt('person', billedTilstand.billede, 'rund');
  h += '<div class="felt"><label>Farve (bruges hvis der ikke er et billede)</label>' +
       '<div class="emoji-vaelger" id="p-farve">';
  FARVER.forEach(function (f) {
    h += '<button type="button" data-f="' + f + '" class="farveknap' +
         (f === valgtFarve ? ' valgt' : '') + '" style="background:' + f + '"></button>';
  });
  h += '</div></div>';
  h += '<div class="kontakt"><input type="checkbox" id="p-aktiv"' + (p.aktiv ? ' checked' : '') +
       '><label for="p-aktiv">Vis i kiosken</label></div>';

               'Flytter du en person til Ex\'ere, bliver de bare vist under den knap i stedet.</p>';
  h += '<div class="knapper">' +
       '<button class="stor-knap graa" id="pd-annuller">Annullér</button>' +
       '<button class="stor-knap" id="pd-gem">Gem</button></div>';
  h += '</div></div>';
  $('overlaylag').innerHTML = h;

  koblBilledFelt(billedTilstand, true);

    b.onclick = function () {
      valgtGruppe = b.getAttribute('data-g');
      $('p-gruppe').querySelectorAll('button').forEach(function (x) { x.className = 'chip'; });
      b.className = 'chip aktiv';
    };
  });
  $('p-farve').querySelectorAll('button').forEach(function (b) {
    b.onclick = function () {
      valgtFarve = b.getAttribute('data-f');
      $('p-farve').querySelectorAll('button').forEach(function (x) { x.className = 'farveknap'; });
      b.className = 'farveknap valgt';
    };
  });
  $('pd-annuller').onclick = lukDialog;
  $('pd-gem').onclick = function () {
    var data = { id: p.id, navn: $('p-navn').value,
                 gruppe: valgtGruppe, farve: valgtFarve, aktiv: $('p-aktiv').checked };
    if (!String(data.navn).trim()) { toast('Personen skal have et navn', true); return; }
    $('pd-gem').disabled = true;
    kald('gemPerson', S.pin, data)
      .then(function (svar) {
        S.personer = svar.personer;
        return gemBilledeFor(svar.id, billedTilstand);
      })
      .then(function () { lukDialog(); render(); toast('Gemt'); })
      .catch(function (e) {
        if ($('pd-gem')) $('pd-gem').disabled = false;
        toast(e.message, true);

  });
  var gruppeListe = Object.keys(perGruppe);

    h += '<div class="sektion"><h3>Pr. gruppe</h3>';

      h += '<div class="detaljelinje"><div class="n"><strong>' + esc(g) + '</strong></div>' +

           '<div class="b">' + esc(kr(x.total)) + '</div></div>';

  h += '<div class="sektion"><h3>Pr. person – tryk for detaljer</h3>';
  r.personer.forEach(function (p) {
    var aaben = S.aabenPerson === p.id;
    h += '<div class="rapportraekke" data-rapportperson="' + esc(p.id) + '"' +
         (aaben ? ' style="border-radius:15px 15px 0 0"' : '') + '>' +
         avatarHtml(p, 'lille') +
         '<div class="midt"><div class="titel">' + esc(p.navn) +
         (p.gruppe ? ' <span class="maerkat">' + esc(p.gruppe) + '</span>' : '') + '</div>' +
         '<div class="under">' + p.antal + ' varer</div></div>' +
         '<div class="beloeb">' + esc(kr(p.total)) + '</div>' +
         '<div style="color:var(--tekst-svag);font-size:22px">' + (aaben ? '▾' : '▸') + '</div>' +
         '</div>';
    if (aaben) {
      h += '<div class="detaljer">';
      p.linjer.forEach(function (l) {
        h += '<div class="detaljelinje' + (l.erPant ? ' pantlinje' : '') + '">' +
             '<div class="n">' + (l.erPant ? '🚪 ' : '') + esc(l.produkt) +
             (l.tilstand ? ' <span class="maerkat">' + esc(l.tilstand) + '</span>' : '') + '</div>' +
             '<div class="a">' + l.antal + ' × ' + esc(kr(l.stykPris)) + '</div>' +
             '<div class="b">' + esc(kr(l.total)) + '</div></div>';
      });
      h += '<div class="detaljelinje" style="border-top:2px solid var(--kant);font-weight:800">' +
           '<div class="n">I alt</div><div class="a">' + p.antal + ' varer</div>' +
           '<div class="b">' + esc(kr(p.total)) + '</div></div>';
      h += '<div style="margin-top:10px"><button class="stor-knap graa lille" ' +
           'data-koebslog="' + esc(p.id) + '">Vis alle ' + p.koeb.length +
           ' køb med tidspunkt</button></div>';
      h += '</div>';
    }
  });
  h += '</div>';

  h += '<div class="sektion"><h3>Solgt pr. vare</h3>';
  r.produkter.forEach(function (p) {
    h += '<div class="detaljelinje"><div class="n">' + esc(p.navn) + '</div>' +
         '<div class="a">' + p.antal + ' stk.</div>' +
         '<div class="b">' + esc(kr(p.total)) + '</div></div>';
  });
  h += '</div>';
  return h;
}

function maanedNavn(m) {
  var navne = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli',
               'august', 'september', 'oktober', 'november', 'december'];
  var dele = String(m).split('-');
  if (dele.length !== 2) return m;
  var i = parseInt(dele[1], 10) - 1;
  return (navne[i] || m) + ' ' + dele[0];
}

function hentRapportData(maaned) {
  S.rapport = null;
  S.aabenPerson = null;
  render();
  kald('hentRapport', maaned)
    .then(function (r) { S.rapport = r; S.valgtMaaned = maaned; render(); })
    .catch(function (e) { toast(e.message, true); });
}

  var p = null;

  h += '<div class="knapper"><button class="stor-knap graa" id="kl-luk">Luk</button></div>';

/* ---------- Min side: eget billede og egne køb ---------- */

function visMinSide() {
  var p = S.person;
  if (!p) return;
  var billedTilstand = { billede: billedeFor(p.id), aendret: false };

  function tegn(data) {
    var h = '<div class="overlay"><div class="dialog bred">';
    h += '<div class="minside-top">' + avatarHtml(p) +
         '<div class="midt"><div class="navn">' + esc(p.navn) + '</div>' +
         '<div class="under">' + esc(p.gruppe || '') + '</div></div></div>';

    h += billedFelt('person', billedTilstand.billede, 'rund');

    h += '<div class="felt"><label>Dine køb i ' +
         esc(data ? maanedNavn(data.maaned) : 'denne måned') + '</label>';
    if (!data) {
      h += '<div class="tom-besked" style="padding:26px"><div class="spinner" ' +
           'style="margin:0 auto"></div></div>';
    } else if (!data.linjer.length) {
      h += '<div class="tom-besked" style="padding:26px">' +
           'Du har ikke købt noget i denne måned endnu.</div>';
    } else {
      h += '<div class="minside-sum">' +
           '<div class="kort"><div class="v">' + esc(kr(data.total)) + '</div>' +
           '<div class="l">I alt</div></div>' +
           '<div class="kort"><div class="v">' + data.antal + '</div>' +
           '<div class="l">Varer</div></div>' +
           (data.pantAntal ? '<div class="kort"><div class="v">' + esc(kr(data.pantTotal)) +
             '</div><div class="l">Heraf pant</div></div>' : '') +
           '</div>';
      h += '<div class="kunlaes">🔒 Du kan se din historik, men ikke rette i den. ' +
           'Er noget forkert, så sig det til den der styrer regnskabet.</div>';
      data.linjer.forEach(function (l) {
        h += '<div class="detaljelinje' + (l.erPant ? ' pantlinje' : '') + '">' +
             '<div class="n">' + (l.erPant ? '🚪 ' : '') + esc(l.produkt) +
             (l.tilstand ? ' <span class="maerkat">' + esc(l.tilstand) + '</span>' : '') + '</div>' +
             '<div class="a">' + l.antal + ' × ' + esc(kr(l.stykPris)) + '</div>' +
             '<div class="b">' + esc(kr(l.total)) + '</div></div>';
      });
      h += '<div style="margin-top:12px">' +
           '<button class="stor-knap graa lille" id="ms-alle">Vis alle ' +
           data.koeb.length + ' køb med tidspunkt</button></div>';
    }
    h += '</div>';

    h += '<div class="knapper">' +
         '<button class="stor-knap" id="ms-luk">Luk</button></div>';
    h += '</div></div>';
    $('overlaylag').innerHTML = h;

    koblBilledFelt(billedTilstand, true);
    // Billedet gemmes med det samme – ingen PIN, det er ens eget
    var oprindelig = billedTilstand.billede;
    var overvaag = setInterval(function () {
      if (!$('b-preview')) { clearInterval(overvaag); return; }
      if (!billedTilstand.aendret || billedTilstand.billede === oprindelig) return;
      oprindelig = billedTilstand.billede;
      billedTilstand.aendret = false;
      var nyt = billedTilstand.billede;
      var kald_ = nyt ? kald('gemEgetBillede', p.id, nyt) : kald('sletEgetBillede', p.id);
      kald_.then(function () {
        if (nyt) S.billeder[p.id] = nyt; else delete S.billeder[p.id];
        gemBilledCache();
        nulstilBilledStempel();
        toast(nyt ? 'Dit billede er gemt' : 'Billedet er fjernet');
        var av = document.querySelector('.minside-top .avatar');
        if (av) av.outerHTML = avatarHtml(p);
      }).catch(function (e) { toast(e.message, true); });
    }, 400);

    $('ms-luk').onclick = function () { clearInterval(overvaag); lukDialog(); render(); };
    if ($('ms-alle')) {
      $('ms-alle').onclick = function () { clearInterval(overvaag); visMineKoeb(data); };
    }
  }

  tegn(null);
  kald('hentEgneKoeb', p.id, null)
    .then(function (data) { tegn(data); })
    .catch(function (e) { toast(e.message, true); });
}

       ['Travleste dag', p.travlesteDag ? p.travlesteDag + ' for ' + kr(p.travlesteDagBeloeb) : '–'],
       ['Foretrukne tidspunkt', p.yndlingstime !== null
          ? p.yndlingsdag + ' kl. ' + p.yndlingstime : '–'],
       ['Køb mellem midnat og fem', p.natteKoeb + ' stk.'],
       ['Pant betalt', p.pantAntal + ' stk. (' + kr(p.pantTotal) + ')'],

       ['Væddeløb', p.loeb + ' løb · ' + p.sejre + ' sluppet · ' + p.ordninger + ' ordninger' +

/* ---------- Selve showet ---------- */

var showTimer = null;

/** Bygger slides ud fra årets tal. */
function byggShow(st) {
  var s = [];
  var P = st.personer;
  function bedst(felt, mindstEn) {
    var k = P.filter(function (p) { return !mindstEn || p[felt] > 0; })
             .sort(function (a, b) { return b[felt] - a[felt]; });
    return k.length ? k[0] : null;
  }

  s.push({ hat: 'KØLESKABET', stor: st.aar, under: 'Året der gik', ikon: '🧊' });

  s.push({ hat: 'I ALT', stor: kr(st.total), ikon: '💰',
    under: st.antalVarer + ' varer fordelt på ' + st.antalKoeb + ' handler',
    ekstra: st.pantTotal ? 'heraf ' + kr(st.pantTotal) + ' i pant' : '' });

  if (st.maaneder.length > 1) {
    var maks = Math.max.apply(null, st.maaneder.map(function (m) { return m.total; }));
    var soejler = st.maaneder.map(function (m) {
      return '<div class="soejle"><div class="stang" style="height:' +
             Math.max(3, Math.round(m.total / maks * 100)) + '%"></div>' +
             '<span>' + m.maaned.substring(5) + '</span></div>';
    }).join('');
    s.push({ hat: 'MÅNED FOR MÅNED', ikon: '📈',
      html: '<div class="soejler">' + soejler + '</div>',
      under: 'Travleste måned: ' + maanedNavn(st.maaneder.slice().sort(function (a, b) {
        return b.total - a.total; })[0].maaned) });
  }

  if (st.varer.length) {
    s.push({ hat: 'MEST DRUKKET', stor: st.varer[0].navn, ikon: '🏅',
      under: st.varer[0].antal + ' stk. på et år',
      liste: st.varer.slice(1, 5).map(function (v, i) {
        return (i + 2) + '. ' + v.navn + ' · ' + v.antal + ' stk.'; }) });
  }

  if (st.travlesteDato) {
    s.push({ hat: 'ÅRETS VILDESTE DAG', stor: st.travlesteDato.dato, ikon: '🔥',
      under: 'Der gik varer for ' + kr(st.travlesteDato.total) + ' den dag',
      ekstra: 'Ellers er ' + st.travlesteUgedag + ' kl. ' + st.travlesteTime +
              ' det travleste tidspunkt' });
  }

  if (P.length) {
    s.push({ hat: 'ÅRETS TØRSTIGSTE', stor: P[0].navn, ikon: '🥇',
      under: kr(P[0].total) + ' · ' + P[0].antal + ' varer · ' + P[0].andel + '% af hele huset',
      liste: P.slice(1, 3).map(function (p, i) {
        return (i === 0 ? '🥈 ' : '🥉 ') + p.navn + ' · ' + kr(p.total); }) });
  }

  var nat = bedst('natteKoeb', true);
  if (nat) s.push({ hat: 'ÅRETS NATTERAVN', stor: nat.navn, ikon: '🦉',
    under: nat.natteKoeb + ' varer hentet mellem midnat og fem' });

  var stam = bedst('antalDage', true);
  if (stam) s.push({ hat: 'STAMGÆSTEN', stor: stam.navn, ikon: '🚪',
    under: 'Ved køleskabet ' + stam.antalDage + ' forskellige dage',
    ekstra: 'Længste stime: ' + stam.laengsteStime + ' dage i træk' });

  var pant = bedst('pantAntal', true);
  if (pant) s.push({ hat: 'PANTSAMLEREN', stor: pant.navn, ikon: '🚶',
    under: pant.pantAntal + ' flasker taget med ud af huset' });

  var stor = bedst('stoersteKoeb', true);
  if (stor) s.push({ hat: 'ÅRETS STØRSTE HANDEL', stor: kr(stor.stoersteKoeb), ikon: '🛒',
    under: stor.navn + ' i én omgang' });

  if (st.loeb) {
    s.push({ hat: 'HESTEVÆDDELØB', stor: st.loeb + ' løb', ikon: '🐎',
      under: 'Det blev til ' + st.ordninger + ' ordninger i alt' });

    var uheldig = bedst('ordninger', true);
    if (uheldig) s.push({ hat: 'ÅRETS UHELDIGSTE', stor: uheldig.navn, ikon: '💀',
      under: uheldig.ordninger + ' ordninger ud af ' + uheldig.loeb + ' løb' });

    var heldige = P.filter(function (p) { return p.loeb >= 3; })
      .sort(function (a, b) { return (b.sejre / b.loeb) - (a.sejre / a.loeb); });
    if (heldige.length && heldige[0].sejre > 0) {
      var hl = heldige[0];
      s.push({ hat: 'ÅRETS HELDIGSTE', stor: hl.navn, ikon: '🍀',
        under: 'Slap i ' + hl.sejre + ' af ' + hl.loeb + ' løb (' +
               Math.round(hl.sejre / hl.loeb * 100) + '%)' });
    }
  }

  var fortryd = bedst('annullerede', true);
  if (fortryd) s.push({ hat: 'ÅRETS FORTRYDER', stor: fortryd.navn, ikon: '↩️',
    under: fortryd.annullerede + ' fortrudte køb' });

  s.push({ hat: 'TAK FOR I ÅR', stor: kr(st.total), ikon: '🍻',
    under: st.personer.length + ' personer, ' + st.antalVarer + ' varer, ' +
           st.ordninger + ' ordninger' });

  return s;
}

function startShow() {
  var st = S.aarsstat;
  if (!st) return;
  var slides = byggShow(st);
  var nr = 0;

  function tegn() {
    var d = slides[nr];
    var h = '<div class="show" id="show">';
    h += '<div class="showkort">';
    h += '<div class="showikon">' + (d.ikon || '✨') + '</div>';
    h += '<div class="showhat">' + esc(d.hat) + '</div>';
    if (d.stor) h += '<div class="showstor">' + esc(d.stor) + '</div>';
    if (d.html) h += d.html;
    if (d.under) h += '<div class="showunder">' + esc(d.under) + '</div>';
    if (d.ekstra) h += '<div class="showekstra">' + esc(d.ekstra) + '</div>';
    if (d.liste && d.liste.length) {
      h += '<div class="showliste">' +
           d.liste.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') +
           '</div>';
    }
    h += '</div>';
    h += '<div class="showbund">' +
         '<button class="showknap" data-showtilbage="1">‹</button>' +
         '<div class="showprikker">' +
         slides.map(function (x, i) {
           return '<span class="' + (i === nr ? 'nu' : '') + '"></span>'; }).join('') +
         '</div>' +
         '<button class="showknap" data-showfrem="1">›</button>' +
         '</div>';
    h += '<button class="showluk" data-showluk="1">✕</button>';
    h += '</div>';
    $('overlaylag').innerHTML = h;

    clearTimeout(showTimer);
    showTimer = setTimeout(function () { skift(1); }, 7000);
    nulstilInaktiv();   // et kørende show må ikke lukke administrationen

    $('show').onclick = function (ev) {
      if (ev.target.closest('[data-showtilbage]')) { skift(-1); return; }
      if (ev.target.closest('[data-showfrem]')) { skift(1); return; }
      if (ev.target.closest('[data-showluk]')) { luk(); return; }
      skift(1);
    };
  }
  function skift(retning) {
    nr += retning;
    if (nr < 0) nr = 0;
    if (nr >= slides.length) { luk(); return; }
    tegn();
  }
  function luk() {
    clearTimeout(showTimer);
    showTimer = null;
    lukDialog();
    render();
  }
  tegn();
}

function gemIndstillinger() {
  var nyPin = $('i-pin').value.trim();
  var opgaver = [
    ['Titel', $('i-titel').value.trim() || 'Køleskabet'],
    ['Grupper', $('i-grupper').value.trim() || 'Beboere, Ex\'ere'],
    ['StandardGruppe', $('i-stdgruppe').value.trim() || 'Beboere'],
    ['Valuta', $('i-valuta').value.trim() || 'kr'],
    ['FortrydSekunder', $('i-fortryd').value || 8],
    ['InaktivSekunder', $('i-inaktiv').value || 60],
    ['StandardMinLager', $('i-min').value || 3],
    ['PantBeløb', $('i-pant').value || 0],
    ['TilladSalgUdenLager', $('i-uden').checked ? 'ja' : 'nej'],
    ['TilladGæster', $('i-gaester').checked ? 'ja' : 'nej'],
    ['KnapStørrelse', S.indst.knapStoerrelse]
  ];
  if (nyPin) {
    if (!/^\d{4}$/.test(nyPin)) { toast('PIN skal være 4 cifre', true); return; }
    opgaver.push(['AdminPin', nyPin]);
  }
  var kaede = opgaver.reduce(function (p, o) {
    return p.then(function () { return kald('saetIndstilling', S.pin, o[0], o[1]); });
  }, Promise.resolve());

  kaede.then(function () { return kald('hentStartdata'); })
    .then(function (d) {
      S.indst = d.indstillinger;
      anvendKnapStoerrelse(S.indst.knapStoerrelse);
      S.gruppe = null;
      if (nyPin) S.pin = nyPin;
      document.title = S.indst.titel;
      render();
      toast('Indstillinger gemt');
    })
    .catch(function (e) { toast(e.message, true); });
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-person],[data-produkt],[data-gaa],[data-gruppe],[data-kategori],' +
    '[data-plus],[data-minus],[data-koeb],[data-toemkurv],[data-kurvaaben],[data-fane],[data-genindlaes],' +
    '[data-pantlinje],[data-pantalle],[data-minside],[data-fuldskaerm],[data-nygaest],' +
    '[data-startshow],[data-aarsperson],[data-aarsfane],[data-hentadresser],[data-skala],' +
    '[data-nytprodukt],[data-redigerprodukt],[data-pris],[data-nyperson],[data-redigerperson],' +
    '[data-juster],[data-paafyld],[data-optael],[data-indkoeb],[data-lagerlog],' +
    '[data-nytilstand],[data-redigertilstand],[data-taendtilstand],[data-sluktilstand],' +
    '[data-spilindstil],[data-spiltaend],' +
    '[data-rapportperson],[data-koebslog],[data-eksport],[data-csv],[data-afregn],' +
    '[data-gemindst]');
  if (!t) { nulstilInaktiv(); return; }
  var a = function (n) { return t.getAttribute(n); };

  if (a('data-person')) {
    S.person = personMed(a('data-person'));
    S.kurv = {}; S.kurvAaben = false; S.kategori = 'ALLE';
    S.skaerm = 'produkter'; render(); return;
  }
  if (a('data-produkt')) { tilfoejTilKurv(a('data-produkt')); return; }
  if (a('data-plus')) { tilfoejTilKurv(a('data-plus')); return; }
  if (a('data-pantlinje')) { skiftPantPaaLinje(a('data-pantlinje')); return; }
  if (a('data-pantalle')) { saetPantPaaAlle(a('data-pantalle') === '1'); render(); return; }
  if (a('data-minus')) { fjernFraKurv(a('data-minus')); return; }
  if (a('data-toemkurv')) { S.kurv = {}; S.kurvAaben = false; render(); return; }
  if (a('data-kurvaaben')) { S.kurvAaben = !S.kurvAaben; render(); return; }
  if (a('data-minside')) { clearTimeout(inaktivTimer); visMinSide(); return; }
  if (a('data-fuldskaerm')) { skiftFuldSkaerm(); return; }
  if (a('data-nygaest')) { visNyGaest(); return; }
  if (a('data-koeb')) { gennemfoerKoeb(); return; }
  if (a('data-gruppe')) { S.gruppe = a('data-gruppe'); render(); return; }
  if (a('data-kategori')) { S.kategori = a('data-kategori'); render(); return; }

  if (a('data-gaa') === 'personer') {
    if (S.skaerm === 'admin') { S.pin = null; S.aarsstat = null; S.rapport = null; }
    S.skaerm = 'personer'; S.person = null; S.kurv = {}; S.kurvAaben = false;
    render(); return;
  }
  if (a('data-gaa') === 'admin') {
    bedOmPin().then(function (pin) {
      if (!pin) return;
      S.pin = pin; S.skaerm = 'admin'; S.adminFane = 'lager';
      clearTimeout(inaktivTimer);
      render();
    });
    return;
  }

  if (a('data-fane')) {
    S.adminFane = a('data-fane');
    render();
    if (S.adminFane === 'tilstande') {
      kald('hentTilstande').then(function (liste) {
        S.tilstande = liste;
        render();
      }).catch(function (e) { toast(e.message, true); });
    }
    if (S.adminFane === 'aarsshow') {
      kald('hentAar', S.pin).then(function (aar) {
        S.aar = aar;
        S.valgtAar = S.valgtAar && aar.indexOf(S.valgtAar) !== -1 ? S.valgtAar : aar[0];
        hentAarsdata(S.valgtAar);
      }).catch(function (e) { toast(e.message, true); });
    }
    if (S.adminFane === 'rapport') {
      kald('hentMaaneder').then(function (m) {
        S.maaneder = m;
        S.valgtMaaned = S.valgtMaaned && m.indexOf(S.valgtMaaned) !== -1 ? S.valgtMaaned : m[0];
        hentRapportData(S.valgtMaaned);
      }).catch(function (e) { toast(e.message, true); });
    }
    return;
  }
  if (a('data-genindlaes')) {
    Promise.all([kald('hentStartdata'), kald('hentBilleder')])
      .then(function (svar) {
        S.personer = svar[0].personer; S.produkter = svar[0].produkter;
        S.tilstand = svar[0].tilstand || null;
        if (svar[0].spil) S.spil = svar[0].spil;
        S.indst = svar[0].indstillinger;
        anvendKnapStoerrelse(S.indst.knapStoerrelse);
        S.billeder = svar[1] || {};
        gemBilledCache();
        render(); toast('Opdateret');
      }).catch(function (e) { toast(e.message, true); });
    return;
  }

  if (a('data-nytprodukt')) { redigerProdukt(null); return; }
  if (a('data-redigerprodukt')) { redigerProdukt(a('data-redigerprodukt')); return; }
  if (a('data-pris')) { aendrPris(a('data-pris')); return; }
  if (a('data-nyperson')) { redigerPerson(null); return; }
  if (a('data-redigerperson')) { redigerPerson(a('data-redigerperson')); return; }

  if (a('data-juster')) {
    kald('justerLager', S.pin, a('data-juster'), parseInt(a('data-delta'), 10), 'Hurtigjustering')
      .then(function (p) { S.produkter = p; render(); })
      .catch(function (e) { toast(e.message, true); });
    return;
  }
  if (a('data-paafyld')) {
    var pp = produktMed(a('data-paafyld'));
    numpad({ titel: 'Påfyld ' + pp.navn,
             hjaelp: 'Der står ' + pp.lager + ' på lager nu. Hvor mange lægger du i?',
             start: '', enhed: 'stk.' }).then(function (v) {
      if (v === null || !v) return;
      kald('paafyldLager', S.pin, pp.id, v, 'Påfyldning')
        .then(function (p) { S.produkter = p; render(); toast('+' + v + ' ' + pp.navn); })
        .catch(function (e) { toast(e.message, true); });
    });
    return;
  }
  if (a('data-optael')) {
    var op = produktMed(a('data-optael'));
    numpad({ titel: 'Optæl ' + op.navn,
             hjaelp: 'Systemet siger ' + op.lager + '. Hvor mange ligger der i virkeligheden?',
             start: op.lager, enhed: 'stk.' })
      .then(function (v) {
        if (v === null) return;
        kald('optaelLager', S.pin, op.id, v, 'Optælling')
          .then(function (p) { S.produkter = p; render(); toast(op.navn + ' sat til ' + v); })
          .catch(function (e) { toast(e.message, true); });
      });
    return;
  }
  if (a('data-indkoeb')) { visIndkoeb(); return; }
  if (a('data-lagerlog')) { visLagerlog(); return; }

  if (a('data-spilindstil')) { visSpilIndstillinger(); return; }
  if (a('data-spiltaend')) {
    var til = a('data-spiltaend') === '1';
    kald('saetIndstilling', S.pin, 'SpilHest', til ? 'ja' : 'nej')
      .then(function () { return kald('hentSpil'); })
      .then(function (sp) {
        S.spil = sp; render();
        toast(til ? 'Hestevæddeløb er slået til' : 'Hestevæddeløb er slået fra');
      })
      .catch(function (e) { toast(e.message, true); });
    return;
  }

  if (a('data-nytilstand')) { redigerTilstand(null); return; }
  if (a('data-redigertilstand')) { redigerTilstand(a('data-redigertilstand')); return; }
  if (a('data-taendtilstand')) { visAktiverTilstand(a('data-taendtilstand')); return; }
  if (a('data-sluktilstand')) {
    kald('deaktiverTilstande', S.pin)
      .then(function (svar) {
        S.tilstande = svar.tilstande; S.tilstand = null;
        render(); toast('Normale priser igen');
      })
      .catch(function (e) { toast(e.message, true); });
    return;
  }

  if (a('data-rapportperson')) {
    var rid = a('data-rapportperson');
    S.aabenPerson = S.aabenPerson === rid ? null : rid;
    render(); return;
  }
  if (a('data-koebslog')) { visKoebslog(a('data-koebslog')); return; }
  if (a('data-eksport')) {
    toast('Laver fane i regnearket…');
    kald('eksporterTilFane', S.pin, S.valgtMaaned)
      .then(function (r) { toast('Gemt som fanen "' + r.navn + '" i regnearket'); })
      .catch(function (e) { toast(e.message, true); });
    return;
  }
  if (a('data-csv')) {
    kald('hentCsv', S.valgtMaaned).then(visCsv)
      .catch(function (e) { toast(e.message, true); });
    return;
  }
  if (a('data-afregn')) {
    var saet = a('data-afregn') === '1';
    kald('saetAfregnet', S.pin, S.valgtMaaned, saet)
      .then(function () {
        S.rapport.afregnet = saet; render();
        toast(saet ? 'Markeret som afregnet' : 'Markering fjernet');
      })
      .catch(function (e) { toast(e.message, true); });
    return;
  }
  if (a('data-startshow')) { startShow(); return; }
  if (a('data-aarsperson')) {
    var aid = 'aar-' + a('data-aarsperson');
    S.aabenPerson = S.aabenPerson === aid ? null : aid;
    render(); return;
  }
  if (a('data-aarsfane')) {
    toast('Laver fane i regnearket…');
    kald('eksporterAarTilFane', S.pin, S.valgtAar)
      .then(function (r) { toast('Gemt som fanen "' + r.navn + '"'); })
      .catch(function (e) { toast(e.message, true); });
    return;
  }
  if (a('data-skala')) {
    var v = parseInt(a('data-skala'), 10);
    S.indst.knapStoerrelse = v;
    anvendKnapStoerrelse(v);
    $('i-skala').querySelectorAll('[data-skala]').forEach(function (b) {
      b.className = 'chip' + (parseInt(b.getAttribute('data-skala'), 10) === v ? ' aktiv' : '');
    });
    return;
  }
  if (a('data-hentadresser')) { visAdresser(); return; }
  if (a('data-gemindst')) { gemIndstillinger(); return; }
});

document.addEventListener('change', function (ev) {
  if (!ev.target) return;
  if (ev.target.id === 'maanedvalg') hentRapportData(ev.target.value);
  if (ev.target.id === 'aarvalg') hentAarsdata(ev.target.value);
});

['touchstart', 'mousedown', 'keydown'].forEach(function (e) {
  document.addEventListener(e, nulstilInaktiv, { passive: true });
});

function visCsv(csv) {
  var h = '<div class="overlay"><div class="dialog bred">';
  h += '<h2>CSV til regnskab</h2>';
  h += '<p class="hjaelp">Markér alt og kopiér – semikolon-adskilt, klar til Excel og Google Sheets.</p>';
  h += '<textarea id="csvfelt" class="csvfelt">' + esc(csv) + '</textarea>';
  h += '<div class="knapper"><button class="stor-knap graa" id="csv-luk">Luk</button>' +
       '<button class="stor-knap" id="csv-kopi">Kopiér</button></div></div></div>';
  $('overlaylag').innerHTML = h;
  $('csv-luk').onclick = lukDialog;
  $('csv-kopi').onclick = function () {
    var f = $('csvfelt');
    f.select();
    try { document.execCommand('copy'); toast('Kopieret'); }
    catch (e) { toast('Markér teksten og tryk Ctrl+C', true); }
  };
}

/* ================================================================== *
 * Start                                                              *
 * ================================================================== */

function hentBillederFraServer() {
  var lokalt = null;
  try { lokalt = localStorage.getItem(BILLED_STEMPEL); } catch (e) {}

  function hentAlt(stempel) {
    return kald('hentBilleder').then(function (b) {
      S.billeder = b || {};
      gemBilledCache();
      if (stempel) { try { localStorage.setItem(BILLED_STEMPEL, stempel); } catch (e) {} }
      render();
    });
  }

  // Først et lille stempel. Er billederne uændrede, springes de tunge data over.
  return kald('hentBilledStempel').then(
    function (stempel) {
      if (lokalt && stempel === lokalt && Object.keys(S.billeder).length) return;
      return hentAlt(stempel);
    },
    // Kan stemplet ikke hentes – fx en ældre udrulning – så hent som før,
    // hellere end at stå uden billeder
    function () { return hentAlt(null); }
  ).catch(function () { /* cachen bruges videre */ });
}

/* Selvstændig udgave: tjek hvert 10. minut om siden er opdateret, og genindlæs
 * når kiosken står på personlisten og intet ligger i offline-køen. */
function holdOpdateret() {
  if (!window.KOELESKAB_API || !window.fetch) return;
  var hent = function () {
    return fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.text(); });
  };
  var foerste = null;
  hent().then(function (t) { foerste = t; }).catch(function () {});
  setInterval(function () {
    if (foerste === null || S.skaerm !== 'personer' || (S.koe && S.koe.length)) return;
    hent().then(function (t) {
      if (t && t !== foerste && S.skaerm === 'personer') location.reload();
    }).catch(function () {});
  }, 600000);
}

function start() {
  holdOpdateret();
  laesKoe();
  laesBilledCache();
  kald('hentStartdata')
    .then(function (d) {
      S.personer = d.personer;
      S.produkter = d.produkter;
      S.tilstand = d.tilstand || null;
      if (d.spil) S.spil = d.spil;
      S.indst = d.indstillinger;
      anvendKnapStoerrelse(S.indst.knapStoerrelse);
      document.title = S.indst.titel;
      $('loader').classList.add('skjul');
      render();
      holdSkaermTaendt();
      hentBillederFraServer();
      if (S.koe.length) afsendKoe();
    })
    .catch(function (e) {
      $('loader').innerHTML = '<div style="text-align:center;padding:30px">' +
        '<div style="font-size:52px;margin-bottom:14px">⚠️</div>' +
        '<div style="font-size:21px;font-weight:700;margin-bottom:8px">Kunne ikke hente data</div>' +
        '<div style="color:var(--tekst-svag);margin-bottom:20px">' + esc(e.message) + '</div>' +
        '<button class="stor-knap" onclick="location.reload()">Prøv igen</button></div>';
    });
}

// Hold lagertal i sync, hvis flere skærme er åbne samtidig
setInterval(function () {
  if (S.skaerm !== 'personer') return;
  kald('hentProdukter').then(function (svar) {
    S.produkter = svar.produkter;
    S.tilstand = svar.tilstand;
    if (svar.spil) S.spil = svar.spil;
    if (S.skaerm === 'personer') render();
  }).catch(function () {});
}, 60000);

start();
</script>
